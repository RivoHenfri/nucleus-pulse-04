<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#06080B" />
    <title>PULSE 04 — NUCLEUS · Wheel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;800&display=swap" rel="stylesheet">
    <style>
      /* The same faces as PULSE 01 and 02: Plus Jakarta Sans for the room,
         Instrument Serif for display. PULSE 04 has no records to print, so
         the mono face PULSE 02 added is not carried over. */
      body {
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        background: #06080B;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
      }
      .font-display { font-family: 'Instrument Serif', Georgia, serif; letter-spacing: 0.02em; }

      /* Only the animations that run on their own live here. Anything whose
         timing follows the participant — the spin above all — is driven by
         Motion for React instead. */

      /* The nucleus breathes. It does not glow for attention. */
      @keyframes nucleusBreath {
        0%, 100% { transform: scale(1);    opacity: 0.65; box-shadow: 0 0 14px 2px rgba(251, 224, 165, 0.16); }
        50%      { transform: scale(1.14); opacity: 0.95; box-shadow: 0 0 22px 6px rgba(251, 224, 165, 0.26); }
      }
      .animate-nucleusBreath { animation: nucleusBreath 4.2s infinite ease-in-out; }

      @keyframes ping {
        0%   { transform: scale(0.9); opacity: 0.5; }
        100% { transform: scale(1.9); opacity: 0; }
      }
      .animate-ping-ring { animation: ping 2.6s cubic-bezier(0, 0, 0.2, 1) infinite; }

      /* The dust around the wheel turns the other way, very slowly: one lap a
         minute. Two things circling in opposite directions is what makes the
         orbit read as something alive rather than as a dial. */
      @keyframes orbitDrift { to { transform: rotate(-360deg); } }
      .animate-orbitDrift { animation: orbitDrift 60s linear infinite; }

      /* Ten seconds a cycle — six breaths a minute, the same period as the
         calm bed's swell underneath it. The eye and the ear are paced by the
         same clock, and that is most of why the wheel feels unhurried. */
      @keyframes breathe {
        0%, 100% { opacity: 0.35; transform: scale(0.96); }
        50%      { opacity: 0.9;  transform: scale(1.04); }
      }
      .animate-breathe { animation: breathe 10s ease-in-out infinite; }

      @media (prefers-reduced-motion: reduce) {
        .animate-orbitDrift, .animate-breathe, .animate-ping-ring, .animate-nucleusBreath { animation: none; }
      }
    </style>
  </head>
  <body class="text-gray-200">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
