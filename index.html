<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#06080B" />
    <title>PULSE 04 — NUCLEUS · Wheel</title>

    <!--
      The link preview, for the thread the spell is shared into. Without these
      the Pulse arrives in WhatsApp as a bare grey URL, which is a poor thing to
      pass around a company when the whole mechanic is people passing it around.

      Notes that are easy to get wrong here:
        * og:image must be an absolute URL. A relative path resolves against the
          crawler, not the page, and silently yields no image at all.
        * It is a PNG, not the webp the app itself uses for the logo — WhatsApp's
          crawler does not reliably render webp, and a preview that works on your
          phone but not on someone else's is worse than none.
        * 1200x630 is the ratio every chat app crops from, and staying under a
          few hundred KB is what keeps the preview from being dropped.
        * WhatsApp caches a preview per URL. If this card is ever changed, the
          thread will keep showing the old one until the cache expires.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NUCLEUS PULSE" />
    <meta property="og:title" content="NUCLEUS PULSE 04 — THE WHEEL" />
    <meta
      property="og:description"
      content="Spin the OPTICS wheel, face a real decision, and see what was guiding it. Two minutes, on your phone."
    />
    <meta property="og:url" content="https://rivohenfri.github.io/nucleus-pulse-04/" />
    <meta property="og:image" content="https://rivohenfri.github.io/nucleus-pulse-04/brand/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Nucleus mark beside the words PULSE 04 — THE WHEEL and the six letters O P T I C S." />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" href="brand/og.png" />

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;800&display=swap" rel="stylesheet">
    <style>
      /* The same faces as PULSE 01 and 02: Plus Jakarta Sans for the room,
         Instrument Serif for display. PULSE 04 has no records to print, so
         the mono face PULSE 02 added is not carried over. */
      body {
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        background: #06080B;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
      }
      .font-display { font-family: 'Instrument Serif', Georgia, serif; letter-spacing: 0.02em; }

      /* Only the animations that run on their own live here. Anything whose
         timing follows the participant — the spin above all — is driven by
         Motion for React instead. */

      /* The nucleus breathes. It does not glow for attention. */
      @keyframes nucleusBreath {
        0%, 100% { transform: scale(1);    opacity: 0.65; box-shadow: 0 0 14px 2px rgba(251, 224, 165, 0.16); }
        50%      { transform: scale(1.14); opacity: 0.95; box-shadow: 0 0 22px 6px rgba(251, 224, 165, 0.26); }
      }
      .animate-nucleusBreath { animation: nucleusBreath 4.2s infinite ease-in-out; }

      @keyframes ping {
        0%   { transform: scale(0.9); opacity: 0.5; }
        100% { transform: scale(1.9); opacity: 0; }
      }
      .animate-ping-ring { animation: ping 2.6s cubic-bezier(0, 0, 0.2, 1) infinite; }

      /* The dust around the wheel turns the other way, very slowly: one lap a
         minute. Two things circling in opposite directions is what makes the
         orbit read as something alive rather than as a dial. */
      @keyframes orbitDrift { to { transform: rotate(-360deg); } }
      .animate-orbitDrift { animation: orbitDrift 60s linear infinite; }

      /* Ten seconds a cycle — six breaths a minute, the same period as the
         calm bed's swell underneath it. The eye and the ear are paced by the
         same clock, and that is most of why the wheel feels unhurried. */
      @keyframes breathe {
        0%, 100% { opacity: 0.35; transform: scale(0.96); }
        50%      { opacity: 0.9;  transform: scale(1.04); }
      }
      .animate-breathe { animation: breathe 10s ease-in-out infinite; }

      @media (prefers-reduced-motion: reduce) {
        .animate-orbitDrift, .animate-breathe, .animate-ping-ring, .animate-nucleusBreath { animation: none; }
      }
    </style>
  </head>
  <body class="text-gray-200">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
